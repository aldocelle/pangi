; Tope de subida a nivel de PHP. NO es redundante con la validación del
; controlador: es la mitad que falta.
;
; Python usa `leer_con_tope()`, que aborta la LECTURA al pasarse de 10 MB —
; nunca llega a tener el archivo entero. PHP no funciona así: escribe el
; archivo completo en un temporal ANTES de que el controlador exista, así que
; `$archivo->getSize() > 10 MB` rechaza algo que el servidor ya guardó.
;
; Importa porque `POST /citas/{id}/orden-examen` es PÚBLICO, sin token. Con el
; default de Hostinger (upload_max_filesize = 256 M, ver FASE0.md), cada
; petición podía hacer escribir 256 MB en /tmp antes de ser rechazada, y el
; hosting es COMPARTIDO. El límite por IP acota cuántas, no cuánto pesa cada
; una.
;
; 12 M y no 10: `post_max_size` tiene que dejar lugar al archivo MÁS el resto
; del formulario, y si queda por debajo PHP descarta el cuerpo entero y el
; controlador recibe un POST vacío — un 400 confuso en vez del mensaje real.
; El tope de la aplicación sigue siendo 10 MB y lo sigue diciendo el
; controlador; esto solo evita que el disco pague por intentarlo.
;
; La subida más grande del sistema son los 10 MB de un documento clínico
; (`FichasController::TAMANO_MAX_BYTES`); las fotos de especialista son 4 MB.
upload_max_filesize = 12M
post_max_size = 13M

; Una sola subida por petición en todos los endpoints del sistema.
;
; ⚠️ INERTE, y se deja escrito para que nadie lo vuelva a intentar:
; `max_file_uploads` es PHP_INI_SYSTEM, así que no se puede bajar desde un
; `.user.ini` ni desde un `.htaccess`. El vhost está en 20 (medido el
; 04-sep-2026). Las dos de arriba sí son PHP_INI_PERDIR.
;
; ⚠️ Y este archivo ENTERO no surtía efecto en el servidor del laboratorio: es
; LiteSpeed, y `.user.ini` es cosa de CGI/FastCGI. El mismo tope va ahora
; también en `public/.htaccess`, con `php_value`, que es lo que LiteSpeed lee.
max_file_uploads = 4
